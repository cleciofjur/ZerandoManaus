<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zerando Manaus - O Jogo</title>

    <!-- Configurações PWA -->
    <meta name="theme-color" content="#0b3d2e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- Fonte pixel art (com fallback caso esteja offline) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./style.css" />
    <link rel="manifest" href="./manifest.json" />
    <script src="./script.js" defer></script>
  </head>
<body>
<div class="device-container">
<section id="screen-profile" class="screen active">
        <header class="header">
          <button class="btn-back" onclick="navigateTo('screen-map')">
            ← Mapa
          </button>
          <h2>Perfil do Jogador</h2>
          <span class="header-spacer"></span>
        </header>

        <main class="content">
          <div class="profile-header">
            <div class="avatar">🦜</div>
            <h3 id="player-name">Explorador Manauara</h3>
            <span class="badge">Nível <span id="player-level">1</span></span>
          </div>

          <div class="card profile-stats">
            <div class="stat-item">
              <span>📍 Locais Visitados:</span>
              <strong id="completed-levels">0 / 6</strong>
            </div>
            <div class="stat-item">
              <span>⭐ XP Total:</span>
              <strong id="player-xp">0 XP</strong>
            </div>
            <div class="stat-item">
              <span>🌿 Status:</span>
              <strong id="player-status">Iniciante</strong>
            </div>
          </div>

          <button
            class="btn btn-secondary btn-block btn-reset"
            onclick="resetGame()"
          >
            Reiniciar jogo
          </button>
        </main>
      </section>
<div class="toast" id="toast" aria-live="polite"></div>
<div class="confetti" id="confetti" aria-hidden="true"></div>
</div>
</body>
</html>
