<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zerando Manaus - O Jogo</title>

    <!-- Configurações PWA -->
    <meta name="theme-color" content="#0b3d2e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- Fonte pixel art (com fallback caso esteja offline) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./style.css" />
    <link rel="manifest" href="./manifest.json" />
    <script src="./script.js" defer></script>
  </head>
<body>
<div class="device-container">
<section id="screen-level" class="screen active">
        <header class="header">
          <button class="btn-back" onclick="navigateTo('screen-map')">
            ← Mapa
          </button>
          <h2 id="level-title">Fase 1</h2>
          <span class="header-spacer"></span>
        </header>

        <main class="content level-content">
          <div class="card level-card">
            <div class="level-emoji" id="level-emoji">🎭</div>
            <div class="location-badge" id="location-category">
              História & Cultura
            </div>
            <h3 id="location-name">Teatro Amazonas</h3>
            <p id="location-description">Carregando informações...</p>
          </div>

          <div class="card text-card challenge-box">
            <h4>🎯 Desafio Cultural</h4>
            <p id="location-challenge">Carregando desafio...</p>
          </div>

          <div class="action-stack">
            <p class="quiz-hint" id="quiz-hint"></p>
            <button
              class="btn btn-primary btn-block"
              id="btn-quiz-start"
              onclick="startQuiz()"
            >
              🎯 Fazer Quiz (+50 XP)
            </button>
          </div>
        </main>
      </section>
<section id="screen-quiz" class="screen">
        <header class="header">
          <button class="btn-back" onclick="exitQuiz()">← Fase</button>
          <h2 id="quiz-title">Quiz</h2>
          <span class="header-spacer"></span>
        </header>

        <main class="content">
          <div id="quiz-question-view">
            <div class="quiz-meta">
              <span id="quiz-counter">Pergunta 1 / 5</span>
              <span id="quiz-score">✅ 0</span>
            </div>
            <div class="quiz-bar">
              <div class="quiz-bar-fill" id="quiz-progress-fill"></div>
            </div>

            <div class="card quiz-card">
              <h3 id="quiz-question"></h3>
            </div>

            <div class="quiz-options" id="quiz-options"></div>
            <div
              class="quiz-feedback is-hidden"
              id="quiz-feedback"
              aria-live="polite"
            ></div>
            <button
              class="btn btn-primary btn-block is-hidden"
              id="btn-next"
              onclick="nextQuestion()"
            >
              Próxima →
            </button>
          </div>

          <div id="quiz-result-view" class="is-hidden">
            <div class="card result-card">
              <div class="result-emoji" id="result-emoji">🎉</div>
              <h3 id="result-title">Fase concluída!</h3>
              <div class="result-score" id="result-score"></div>
              <p id="result-msg"></p>
            </div>
            <div class="result-actions">
              <button
                class="btn btn-primary btn-block"
                id="btn-result-primary"
              ></button>
              <button
                class="btn btn-secondary btn-block"
                id="btn-result-secondary"
              ></button>
            </div>
          </div>
        </main>
      </section>
<div class="toast" id="toast" aria-live="polite"></div>
<div class="confetti" id="confetti" aria-hidden="true"></div>
</div>
</body>
</html>
