<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desafio Cultural - Zerando Manaus</title>

  <!-- Configurações PWA -->
  <meta name="theme-color" content="#0b3d2e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Fonte pixel art (com fallback caso esteja offline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <link rel="manifest" href="./manifest.json">
  <script src="./script.js" defer></script>
</head>

<body>
  <div class="device-container">
    <section id="screen-level" class="screen active">
      <header class="header">
        <a class="btn-back" href="./mapa.html">← Mapa</a>
        <h2 id="level-title">Fase 1</h2>
        <span class="header-spacer"></span>
      </header>

      <main class="content level-content">
        <div class="card level-card">
          <div class="level-emoji" id="level-emoji">🎭</div>
          <div class="location-badge" id="location-category">História & Cultura</div>
          <h3 id="location-name">Teatro Amazonas</h3>
          <p id="location-description">Carregando informações...</p>
        </div>

        <div class="card text-card challenge-box">
          <h4>🎯 Desafio Cultural</h4>
          <p id="location-challenge">Carregando desafio...</p>
        </div>

        <div class="action-stack">
          <button class="btn btn-primary btn-block" id="btn-complete" onclick="completeLevel()">Concluir Desafio (+50
            XP)</button>
        </div>
      </main>
    </section>

    <div class="toast" id="toast" aria-live="polite"></div>
    <div class="confetti" id="confetti" aria-hidden="true"></div>
  </div>
</body>
</html>
